<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issues · OpsBoard</title>
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <link rel="stylesheet" href="../tasks/tasks.css">
    <link rel="stylesheet" href="issues.css">
</head>
<body class="app-body">

<aside class="sidebar">
    <div class="logo">
        <span class="logo-icon">◆</span>
        <span class="logo-text">OpsBoard</span>
    </div>
    <nav class="nav">
    <a href="../dashboard/dashboard.html" class="nav-item"><span class="nav-icon">▤</span> Dashboard</a>
    <a href="../tasks/tasks.html" class="nav-item"><span class="nav-icon">☑</span> Tasks</a>
    <a href="../employees/employees.html" class="nav-item" data-role="ADMIN"><span class="nav-icon">👤</span> Employees</a>
    <a href="../teams/teams.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">👥</span> Teams</a>
    <a href="../sla/sla.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">⏱</span> SLA</a>
    <a href="issues.html" class="nav-item active"><span class="nav-icon">⚠</span> Issues</a>
    <a href="../escalations/escalations.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">⬆</span> Escalations</a>
    <a href="../reports/reports.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">📊</span> Reports</a>
</nav>
    <div class="sidebar-footer">
        <div class="user-avatar" id="avatarInitials">--</div>
        <div class="user-meta">
            <div class="user-name" id="userLabelSide">Loading...</div>
            <div class="user-role" id="userRoleSide">—</div>
        </div>
        <button class="logout-btn" onclick="Auth.logout()" title="Logout">⏻</button>
    </div>
</aside>

<main class="main">
    <header class="main-header">
        <div>
            <h1>Issues</h1>
            <p class="subtext">Track bugs, incidents, and resolutions</p>
        </div>
        <button class="primary" onclick="openForm()" data-perm="issue.create">+ New Issue</button>
    </header>

    <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Search issues..." oninput="filterList()" class="search">
        <select id="filterStatus" onchange="filterList()" class="search">
            <option value="">All Status</option>
            <option value="OPEN">Open</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="RESOLVED">Resolved</option>
            <option value="CLOSED">Closed</option>
        </select>
        <select id="filterPriority" onchange="filterList()" class="search">
            <option value="">All Priority</option>
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
            <option value="CRITICAL">Critical</option>
        </select>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>Title</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Reported By</th>
            <th>Assigned To</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="issueBody">
        <tr><td colspan="6" class="loading">Loading issues...</td></tr>
        </tbody>
    </table>
</main>

<div id="issueModal" class="modal" style="display:none">
    <div class="modal-content">
        <h3>New Issue</h3>
        <input id="issueTitle" placeholder="Issue title">
        <textarea id="issueDesc" placeholder="Description"></textarea>
        <div class="row">
            <select id="issuePriority">
                <option value="LOW">🟢 Low</option>
                <option value="MEDIUM" selected>🔵 Medium</option>
                <option value="HIGH">🟠 High</option>
                <option value="CRITICAL">🔴 Critical</option>
            </select>
            <select id="issueStatus">
                <option value="OPEN" selected>Open</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="RESOLVED">Resolved</option>
                <option value="CLOSED">Closed</option>
            </select>
        </div>
        <select id="issueReportedBy">
            <option value="">— Reported By —</option>
        </select>
        <select id="issueAssignee">
            <option value="">— Assigned To —</option>
        </select>
        <div class="modal-actions">
            <button class="ghost" onclick="closeForm()">Cancel</button>
            <button class="primary" onclick="saveIssue()">Save</button>
        </div>
    </div>
</div>

<script src="../config.js"></script>

<script src="issues.js"></script>
</body>
</html>
