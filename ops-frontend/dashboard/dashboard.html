<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="app-body">

<aside class="sidebar">
    <div class="logo">
        <span class="logo-icon">◆</span>
        <span class="logo-text">OpsBoard</span>
    </div>
    <nav class="nav">
    <a href="dashboard.html" class="nav-item active"><span class="nav-icon">▤</span> Dashboard</a>
    <a href="../tasks/tasks.html" class="nav-item"><span class="nav-icon">☑</span> Tasks</a>
    <a href="../employees/employees.html" class="nav-item" data-role="ADMIN"><span class="nav-icon">👤</span> Employees</a>
    <a href="../teams/teams.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">👥</span> Teams</a>
    <a href="../sla/sla.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">⏱</span> SLA</a>
    <a href="../issues/issues.html" class="nav-item"><span class="nav-icon">⚠</span> Issues</a>
    <a href="../escalations/escalations.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">⬆</span> Escalations</a>
    <a href="../reports/reports.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">📊</span> Reports</a>
</nav>
    <div class="sidebar-footer">
        <div class="user-avatar" id="avatarInitials">--</div>
        <div class="user-meta">
            <div class="user-name" id="userLabelSide">Loading...</div>
            <div class="user-role" id="userRoleSide">—</div>
        </div>
        <button class="logout-btn" onclick="Auth.logout()" title="Logout">⏻</button>
    </div>
</aside>

<main class="main">
    <header class="main-header">
        <div>
            <h1>Operations Dashboard</h1>
            <p class="subtext">Real-time task tracking & team performance</p>
        </div>
    </header>

    <section class="kpi-grid">
        <div class="kpi">
            <div class="kpi-icon" style="background:#dbeafe;color:#1d4ed8">📋</div>
            <div><h3>Total Tasks</h3><span id="kpiTotal">—</span></div>
        </div>
        <div class="kpi">
            <div class="kpi-icon" style="background:#d1fae5;color:#047857">✓</div>
            <div><h3>Completed</h3><span id="kpiCompleted">—</span></div>
        </div>
        <div class="kpi">
            <div class="kpi-icon" style="background:#e0e7ff;color:#4338ca">⟳</div>
            <div><h3>In Progress</h3><span id="kpiInProgress">—</span></div>
        </div>
        <div class="kpi">
            <div class="kpi-icon" style="background:#fee2e2;color:#b91c1c">!</div>
            <div><h3>Overdue</h3><span id="kpiOverdue">—</span></div>
        </div>
        <div class="kpi kpi-purple">
            <div class="kpi-icon" style="background:rgba(255,255,255,0.2);color:white">%</div>
            <div><h3>Completion Rate</h3><span id="kpiRate">—</span></div>
        </div>
    </section>

    <section class="charts">
        <div class="chart-card">
            <h3>Tasks by Status</h3>
            <div class="chart-wrap"><canvas id="statusChart"></canvas></div>
        </div>
        <div class="chart-card">
            <h3>Team Performance</h3>
            <div class="chart-wrap"><canvas id="perfChart"></canvas></div>
        </div>
    </section>
</main>

<script src="../config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
