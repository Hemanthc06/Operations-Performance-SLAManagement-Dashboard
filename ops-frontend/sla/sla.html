<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLA · OpsBoard</title>
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <link rel="stylesheet" href="../tasks/tasks.css">
</head>
<body class="app-body">

<aside class="sidebar">
    <div class="logo">
        <span class="logo-icon">◆</span>
        <span class="logo-text">OpsBoard</span>
    </div>
    <nav class="nav">
    <a href="../dashboard/dashboard.html" class="nav-item"><span class="nav-icon">▤</span> Dashboard</a>
    <a href="../tasks/tasks.html" class="nav-item"><span class="nav-icon">☑</span> Tasks</a>
    <a href="../employees/employees.html" class="nav-item" data-role="ADMIN"><span class="nav-icon">👤</span> Employees</a>
    <a href="../teams/teams.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">👥</span> Teams</a>
    <a href="sla.html" class="nav-item active" data-role="ADMIN,MANAGER"><span class="nav-icon">⏱</span> SLA</a>
    <a href="../issues/issues.html" class="nav-item"><span class="nav-icon">⚠</span> Issues</a>
    <a href="../escalations/escalations.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">⬆</span> Escalations</a>
    <a href="../reports/reports.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">📊</span> Reports</a>
</nav>
    <div class="sidebar-footer">
        <div class="user-avatar" id="avatarInitials">--</div>
        <div class="user-meta">
            <div class="user-name" id="userLabelSide">Loading...</div>
            <div class="user-role" id="userRoleSide">—</div>
        </div>
        <button class="logout-btn" onclick="Auth.logout()" title="Logout">⏻</button>
    </div>
</aside>

<main class="main">
    <header class="main-header">
        <div>
            <h1>Service Level Agreements</h1>
            <p class="subtext">Track SLA targets and breaches</p>
        </div>
        <button class="primary" onclick="openForm()" data-perm="sla.create">+ New SLA</button>
    </header>

    <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Search SLAs..." oninput="filterList()" class="search">
        <select id="filterStatus" onchange="filterList()" class="search">
            <option value="">All Status</option>
            <option value="ON_TRACK">On Track</option>
            <option value="AT_RISK">At Risk</option>
            <option value="BREACHED">Breached</option>
            <option value="MET">Met</option>
        </select>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>Title</th>
            <th>Priority</th>
            <th>Target (hrs)</th>
            <th>Actual (hrs)</th>
            <th>Status</th>
            <th>Assignee</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="slaBody">
        <tr><td colspan="7" class="loading">Loading SLAs...</td></tr>
        </tbody>
    </table>
</main>

<div id="slaModal" class="modal" style="display:none">
    <div class="modal-content">
        <h3>New SLA Record</h3>
        <input id="slaTitle" placeholder="SLA title">
        <div class="row">
            <select id="slaPriority">
                <option value="LOW">🟢 Low</option>
                <option value="MEDIUM" selected>🔵 Medium</option>
                <option value="HIGH">🟠 High</option>
                <option value="CRITICAL">🔴 Critical</option>
            </select>
            <select id="slaStatus">
                <option value="ON_TRACK" selected>On Track</option>
                <option value="AT_RISK">At Risk</option>
                <option value="BREACHED">Breached</option>
                <option value="MET">Met</option>
            </select>
        </div>
        <div class="row">
            <input id="slaTargetHours" type="number" placeholder="Target hours" min="1">
            <input id="slaActualHours" type="number" placeholder="Actual hours" min="0">
        </div>
        <select id="slaAssignee">
            <option value="">— Unassigned —</option>
        </select>
        <div class="modal-actions">
            <button class="ghost" onclick="closeForm()">Cancel</button>
            <button class="primary" onclick="saveSLA()">Save</button>
        </div>
    </div>
</div>
<script src="../config.js"></script>

<script src="sla.js"></script>
</body>
</html>
