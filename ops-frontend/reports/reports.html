<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports · OpsBoard</title>
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <link rel="stylesheet" href="../tasks/tasks.css">
    <link rel="stylesheet" href="reports.css">
</head>
<body class="app-body">

<aside class="sidebar">
    <div class="logo">
        <span class="logo-icon">◆</span>
        <span class="logo-text">OpsBoard</span>
    </div>
    <nav class="nav">
    <a href="../dashboard/dashboard.html" class="nav-item"><span class="nav-icon">▤</span> Dashboard</a>
    <a href="../tasks/tasks.html" class="nav-item"><span class="nav-icon">☑</span> Tasks</a>
    <a href="../employees/employees.html" class="nav-item" data-role="ADMIN"><span class="nav-icon">👤</span> Employees</a>
    <a href="../teams/teams.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">👥</span> Teams</a>
    <a href="../sla/sla.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">⏱</span> SLA</a>
    <a href="../issues/issues.html" class="nav-item"><span class="nav-icon">⚠</span> Issues</a>
    <a href="../escalations/escalations.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">⬆</span> Escalations</a>
    <a href="reports.html" class="nav-item active" data-role="ADMIN,MANAGER"><span class="nav-icon">📊</span> Reports</a>
</nav>
    <div class="sidebar-footer">
        <div class="user-avatar" id="avatarInitials">--</div>
        <div class="user-meta">
            <div class="user-name" id="userLabelSide">Loading...</div>
            <div class="user-role" id="userRoleSide">—</div>
        </div>
        <button class="logout-btn" onclick="Auth.logout()" title="Logout">⏻</button>
    </div>
</aside>

<main class="main">
    <header class="main-header">
        <div>
            <h1>Reports & Analytics</h1>
            <p class="subtext">Generate operations summary reports</p>
        </div>
        <button class="primary" onclick="exportCSV()" data-perm="report.view">Export CSV</button>
    </header>

    <!-- SUMMARY CARDS -->
    <section class="summary-grid" id="summaryGrid">
        <div class="summary-card">
            <div class="summary-label">Total Tasks</div>
            <div class="summary-value" id="rTotalTasks">—</div>
        </div>
        <div class="summary-card">
            <div class="summary-label">Completed Tasks</div>
            <div class="summary-value" id="rCompletedTasks">—</div>
        </div>
        <div class="summary-card">
            <div class="summary-label">Open Issues</div>
            <div class="summary-value" id="rOpenIssues">—</div>
        </div>
        <div class="summary-card">
            <div class="summary-label">SLA Breaches</div>
            <div class="summary-value" id="rBreaches">—</div>
        </div>
    </section>

    <!-- CHARTS -->
    <section class="charts">
        <div class="chart-card">
            <h3>Tasks by Status</h3>
            <div class="chart-wrap"><canvas id="reportStatusChart"></canvas></div>
        </div>
        <div class="chart-card">
            <h3>Tasks by Priority</h3>
            <div class="chart-wrap"><canvas id="reportPriorityChart"></canvas></div>
        </div>
    </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="../config.js"></script>

<script src="reports.js"></script>
</body>
</html>
