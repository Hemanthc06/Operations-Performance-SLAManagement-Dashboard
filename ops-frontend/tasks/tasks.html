<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks · OpsBoard</title>
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <link rel="stylesheet" href="tasks.css">
</head>
<body class="app-body">

<aside class="sidebar">
    <div class="logo">
        <span class="logo-icon">◆</span>
        <span class="logo-text">OpsBoard</span>
    </div>
   <nav class="nav">
    <a href="../dashboard/dashboard.html" class="nav-item"><span class="nav-icon">▤</span> Dashboard</a>
    <a href="tasks.html" class="nav-item active"><span class="nav-icon">☑</span> Tasks</a>
    <a href="../employees/employees.html" class="nav-item" data-role="ADMIN"><span class="nav-icon">👤</span> Employees</a>
    <a href="../teams/teams.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">👥</span> Teams</a>
    <a href="../sla/sla.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">⏱</span> SLA</a>
    <a href="../issues/issues.html" class="nav-item"><span class="nav-icon">⚠</span> Issues</a>
    <a href="../escalations/escalations.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">⬆</span> Escalations</a>
    <a href="../reports/reports.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">📊</span> Reports</a>
</nav>
    <div class="sidebar-footer">
        <div class="user-avatar" id="avatarInitials">--</div>
        <div class="user-meta">
            <div class="user-name" id="userLabelSide">Loading...</div>
            <div class="user-role" id="userRoleSide">—</div>
        </div>
        <button class="logout-btn" onclick="Auth.logout()" title="Logout">⏻</button>
    </div>
</aside>

<main class="main">
    <header class="main-header">
        <div>
            <h1>Tasks</h1>
            <p class="subtext">Create, assign, and track all tasks</p>
        </div>
        <button class="primary" onclick="openTaskForm()" data-perm="task.create">+ New Task</button>
    </header>

    <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Search tasks..." oninput="filterTasks()" class="search">
        <select id="filterStatus" onchange="filterTasks()" class="search">
            <option value="">All Status</option>
            <option value="TODO">To Do</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="REVIEW">Review</option>
            <option value="DONE">Done</option>
        </select>
        <select id="filterPriority" onchange="filterTasks()" class="search">
            <option value="">All Priority</option>
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
            <option value="CRITICAL">Critical</option>
        </select>
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>Title</th>
            <th>Assignee</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Due Date</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="taskBody">
        <tr><td colspan="6" class="loading">Loading tasks...</td></tr>
        </tbody>
    </table>
</main>

<!-- MODAL -->
<div id="taskModal" class="modal" style="display:none">
    <div class="modal-content">
        <h3 id="modalTitle">New Task</h3>
        <input id="taskId" type="hidden">
        <input id="taskTitle" placeholder="Task title">
        <textarea id="taskDesc" placeholder="Description (optional)"></textarea>
        <div class="row">
            <select id="taskPriority">
                <option value="LOW">🟢 Low</option>
                <option value="MEDIUM" selected>🔵 Medium</option>
                <option value="HIGH">🟠 High</option>
                <option value="CRITICAL">🔴 Critical</option>
            </select>
            <select id="taskStatus">
                <option value="TODO" selected>To Do</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="REVIEW">Review</option>
                <option value="DONE">Done</option>
            </select>
        </div>
        <div class="row">
            <select id="taskAssignee">
                <option value="">— Unassigned —</option>
            </select>
            <input id="taskDue" type="date">
        </div>
        <div class="modal-actions">
            <button class="ghost" onclick="closeTaskForm()">Cancel</button>
            <button class="primary" onclick="saveTask()">Save</button>
        </div>
    </div>
</div>

<script src="../config.js"></script>
<script src="tasks.js"></script>
</body>
</html>
