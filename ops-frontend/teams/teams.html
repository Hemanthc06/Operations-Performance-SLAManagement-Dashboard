<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams · OpsBoard</title>
    <link rel="stylesheet" href="../dashboard/dashboard.css">
    <link rel="stylesheet" href="../tasks/tasks.css">
</head>
<body class="app-body">

<aside class="sidebar">
    <div class="logo">
        <span class="logo-icon">◆</span>
        <span class="logo-text">OpsBoard</span>
    </div>
    <nav class="nav">
    <a href="../dashboard/dashboard.html" class="nav-item"><span class="nav-icon">▤</span> Dashboard</a>
    <a href="../tasks/tasks.html" class="nav-item"><span class="nav-icon">☑</span> Tasks</a>
    <a href="../employees/employees.html" class="nav-item" data-role="ADMIN"><span class="nav-icon">👤</span> Employees</a>
    <a href="teams.html" class="nav-item active" data-role="ADMIN,MANAGER"><span class="nav-icon">👥</span> Teams</a>
    <a href="../sla/sla.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">⏱</span> SLA</a>
    <a href="../issues/issues.html" class="nav-item"><span class="nav-icon">⚠</span> Issues</a>
    <a href="../escalations/escalations.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">⬆</span> Escalations</a>
    <a href="../reports/reports.html" class="nav-item" data-role="ADMIN,MANAGER"><span class="nav-icon">📊</span> Reports</a>
</nav>
    <div class="sidebar-footer">
        <div class="user-avatar" id="avatarInitials">--</div>
        <div class="user-meta">
            <div class="user-name" id="userLabelSide">Loading...</div>
            <div class="user-role" id="userRoleSide">—</div>
        </div>
        <button class="logout-btn" onclick="Auth.logout()" title="Logout">⏻</button>
    </div>
</aside>

<main class="main">
    <header class="main-header">
        <div>
            <h1>Teams</h1>
            <p class="subtext">Organize employees into teams</p>
        </div>
        <button class="primary" onclick="openForm()" data-perm="team.create">+ New Team</button>
    </header>

    <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Search teams..." oninput="filterList()" class="search">
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>Team Name</th>
            <th>Description</th>
            <th>Members</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="teamBody">
        <tr><td colspan="4" class="loading">Loading teams...</td></tr>
        </tbody>
    </table>
</main>

<div id="teamModal" class="modal" style="display:none">
    <div class="modal-content">
        <h3 id="modalTitle">New Team</h3>
        <input id="teamId" type="hidden">
        <input id="teamName" placeholder="Team Name">
        <textarea id="teamDesc" placeholder="Description (optional)"></textarea>
        <div class="modal-actions">
            <button class="ghost" onclick="closeForm()">Cancel</button>
            <button class="primary" onclick="saveTeam()">Save</button>
        </div>
    </div>
</div>

<script src="../config.js"></script>
<script src="teams.js"></script>
</body>
</html>
